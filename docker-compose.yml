services:
  postgres:
    image: postgres:16
    container_name: morninggrind-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: morninggrind
      POSTGRES_USER: morninggrind
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/morninggrind
      SPRING_DATASOURCE_USERNAME: morninggrind
      SPRING_DATASOURCE_PASSWORD: secret
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data:
