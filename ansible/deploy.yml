---
- name: Deploy morning-grind to production VM
  hosts: prod
  become: true
  vars_files:
    - vars/secrets.yml

  tasks:
    - name: Install Docker prerequisites
      apt:
        name: ["ca-certificates", "curl"]
        state: present
        update_cache: true

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Allow HTTP (port 80) inbound
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "80"
        ctstate: NEW
        jump: ACCEPT
        action: insert
        rule_num: 5
      notify: Persist iptables rules

    - name: Ensure app directory exists
      file:
        path: /opt/morning-grind
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy docker-compose.prod.yml
      copy:
        src: "{{ playbook_dir }}/../docker-compose.prod.yml"
        dest: /opt/morning-grind/docker-compose.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Template .env file
      template:
        src: templates/env.j2
        dest: /opt/morning-grind/.env
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Log in to GHCR
      command: >
        docker login ghcr.io -u lukas5937 -p {{ ghcr_pat }}
      changed_when: false
      no_log: true

    - name: Pull latest images
      command: docker compose pull
      args:
        chdir: /opt/morning-grind

    - name: Start the stack
      command: docker compose up -d
      args:
        chdir: /opt/morning-grind

  handlers:
    - name: Persist iptables rules
      command: netfilter-persistent save
