services:
  postgres:
    image: postgres:16
    container_name: morninggrind-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: morninggrind
      POSTGRES_USER: morninggrind
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


